name: Build Windows x64

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build

      - name: Build Release
        run: cmake --build build --config Release

      - name: Package Artifact
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item build/Release/footprint-audit.exe dist/
          Copy-Item -Recurse data dist/data
          Copy-Item -Recurse assets dist/assets
          Compress-Archive -Path dist/* -DestinationPath footprint-audit-win64.zip

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: footprint-audit-win64
          path: footprint-audit-win64.zip
